<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录 - 任务管理系统</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 420px;
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header h2 { color: #333; font-size: 1.75rem; margin-bottom: 0.5rem; }
        .header p { color: #888; font-size: 0.9rem; }
        .form-group { margin-bottom: 1.25rem; }
        label {
            display: block;
            margin-bottom: 0.4rem;
            color: #444;
            font-weight: 500;
            font-size: 0.9rem;
        }
        label .required { color: #e74c3c; }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e8e8e8;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #fafafa;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
            background: white;
        }
        .input-hint {
            margin-top: 0.4rem;
            font-size: 0.75rem;
            color: #888;
        }
        .remember-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
            font-size: 0.9rem;
        }
        .remember-row label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            margin-bottom: 0;
        }
        .remember-row input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #667eea;
        }
        .btn-login {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn-login:hover:not(:disabled) { opacity: 0.9; }
        .btn-login:active:not(:disabled) { transform: scale(0.98); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-login .spinner {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .message {
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            text-align: center;
            font-size: 0.9rem;
            display: none;
            animation: fadeIn 0.3s ease-out;
        }
        .message.success {
            background-color: #d4edda; color: #155724;
            border: 1px solid #c3e6cb; display: block;
        }
        .message.error {
            background-color: #f8d7da; color: #721c24;
            border: 1px solid #f5c6cb; display: block;
        }
        .footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #666;
        }
        .footer a { color: #667eea; text-decoration: none; font-weight: 500; }
        .footer a:hover { text-decoration: underline; }
        .lock-icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            display: block;
        }
        .lockout-msg {
            margin-top: 0.5rem;
            padding: 0.5rem;
            border-radius: 6px;
            background: #fff3cd;
            color: #856404;
            font-size: 0.8rem;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="lock-icon">🔐</span>
            <h2>欢迎回来</h2>
            <p>登录以继续操作</p>
        </div>
        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="identity">账号 <span class="required">*</span></label>
                <input type="text" id="identity" name="identity" placeholder="用户名 / 邮箱 / 手机号" required>
                <div class="input-hint">支持用户名、邮箱或手机号登录</div>
            </div>
            <div class="form-group">
                <label for="password">密码 <span class="required">*</span></label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required>
            </div>
            <div class="remember-row">
                <label><input type="checkbox" id="rememberMe"> 记住我</label>
            </div>
            <button type="submit" class="btn-login" id="submitBtn">登录</button>
            <div class="lockout-msg" id="lockoutMsg"></div>
        </form>
        <div id="message" class="message"></div>
        <div class="footer">
            还没有账号？<a href="/register">立即注册</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const identityInput = document.getElementById('identity');
        const passwordInput = document.getElementById('password');
        const rememberMe = document.getElementById('rememberMe');
        const submitBtn = document.getElementById('submitBtn');
        const lockoutMsg = document.getElementById('lockoutMsg');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const identity = identityInput.value.trim();
            const password = passwordInput.value;

            if (!identity || !password) {
                showMessage('请输入账号和密码', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span>登录中...';
            lockoutMsg.style.display = 'none';

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        identity: identity,
                        password: password,
                        remember_me: rememberMe.checked
                    })
                });

                const result = await response.json();

                if (result.success) {
                    showMessage('登录成功，正在跳转...', 'success');
                    setTimeout(() => { window.location.href = '/'; }, 1000);
                } else {
                    // 检查是否锁定
                    if (result.lockout_time) {
                        lockoutMsg.textContent = result.message;
                        lockoutMsg.style.display = 'block';
                        submitBtn.disabled = true;
                    } else {
                        showMessage(result.message, 'error');
                        submitBtn.disabled = false;
                        submitBtn.textContent = '登录';
                    }
                }
            } catch (error) {
                showMessage('网络错误，请稍后重试', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = '登录';
            }
        });

        function showMessage(text, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = text;
            msgDiv.className = 'message ' + type;
            if (type === 'success') {
                setTimeout(() => { msgDiv.style.display = 'none'; }, 3000);
            }
        }

        // 自动聚焦
        document.addEventListener('DOMContentLoaded', function() {
            identityInput.focus();
        });
    </script>
</body>
</html>
