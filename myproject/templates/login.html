<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录 - 团队任务管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #4a6fa5, #2c3e50);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .login-card {
            background: #fff;
            color: #2c3e50;
            border-radius: 12px;
            box-shadow: 0 12px 24px rgba(0,0,0,0.1);
            padding: 2rem;
            width: 100%;
            max-width: 400px;
        }
        
        .login-card h2 {
            margin-bottom: 1.5rem;
            color: #4a6fa5;
        }
        
        .form-control {
            background-color: #f8f9fa;
            border: 1px solid #ddd;
        }
        
        .form-control:focus {
            background-color: #fff;
            border-color: #4a6fa5;
            box-shadow: 0 0 0 0.2rem rgba(74, 111, 165, 0.25);
        }
        
        .btn-primary {
            background-color: #4a6fa5;
            border: none;
            transition: background-color 0.3s ease;
        }
        
        .btn-primary:hover {
            background-color: #3a5a80;
        }
        
        .form-text {
            font-size: 0.85rem;
            margin-top: 0.5rem;
            color: #6c757d;
        }
        
        .text-muted {
            color: #abb2b9 !important;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 class="text-center mb-4">
            <i class="fas fa-user-circle"></i> 用户登录
        </h2>
        <form id="login-form">
            <div class="mb-3">
                <label for="username" class="form-label">用户名</label>
                <input type="text" class="form-control" id="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">密码</label>
                <input type="password" class="form-control" id="password" required>
                <div class="form-text">
                    密码区分大小写，请确认输入正确
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">
                <i class="fas fa-sign-in-alt me-2"></i> 登录系统
            </button>
        </form>
        <div class="mt-3 text-center">
            <a href="#" class="text-decoration-none text-muted">忘记密码？</a>
        </div>
    </div>

    <!-- Font Awesome -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script>
        // 表单提交处理
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                alert('请输入用户名和密码！');
                return;
            }

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        identity: username,
                        password
                    })
                });

                if (response.ok) {
                    // 登录成功跳转到主页面
                    window.location.href = '/';
                } else {
                    const data = await response.json();
                    alert('登录失败：' + (data.message || '用户名或密码错误'));
                }
            } catch (error) {
                console.error('登录错误:', error);
                alert('系统错误，请稍后重试');
            }
        });
    </script>
</body>
</html>
