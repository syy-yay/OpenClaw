<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录 - 团队任务管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #4a6fa5, #2c3e50);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .login-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 12px 24px rgba(0,0,0,0.1);
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
        }
        .login-card h2 {
            margin-bottom: 1.5rem;
            color: #4a6fa5;
            font-weight: 700;
        }
        .form-control {
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            padding: 0.7rem 1rem;
            border-radius: 8px;
        }
        .form-control:focus {
            background-color: #fff;
            border-color: #4a6fa5;
            box-shadow: 0 0 0 0.2rem rgba(74, 111, 165, 0.25);
        }
        .btn-primary {
            background-color: #4a6fa5;
            border: none;
            border-radius: 8px;
            padding: 0.7rem;
            transition: background-color 0.3s ease;
        }
        .btn-primary:hover { background-color: #3a5a80; }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

        .go-register {
            color: #6c757d;
            text-decoration: none;
            transition: color 0.2s;
        }
        .go-register:hover { color: #4a6fa5; text-decoration: underline; }

        .alert-box {
            display: none;
            padding: 0.7rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }
        .alert-box.error { display: block; background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert-box.success { display: block; background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 class="text-center mb-4">
            <i class="fas fa-sign-in-alt me-2"></i>用户登录
        </h2>

        <div id="alert-msg" class="alert-box"></div>

        <form id="login-form">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">用户名</label>
                <input type="text" class="form-control" id="username" placeholder="请输入用户名" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label fw-semibold">密码</label>
                <input type="password" class="form-control" id="password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2" id="login-btn">
                <i class="fas fa-sign-in-alt me-2"></i>登录系统
            </button>
        </form>

        <div class="mt-4 text-center">
            <a href="/register" class="go-register">
                <i class="fas fa-user-plus me-1"></i>还没有账号？立即注册
            </a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script>
        const form = document.getElementById('login-form');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('login-btn');
        const alertMsg = document.getElementById('alert-msg');

        function showAlert(text, type) {
            alertMsg.textContent = text;
            alertMsg.className = 'alert-box ' + type;
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            showAlert('', '');

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                showAlert('请输入用户名和密码', 'error');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>登录中…';

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identity: username, password })
                });

                // 登录成功 —— 后端会设置 session cookie，直接跳转首页
                if (response.ok) {
                    window.location.href = '/';
                    return;
                }

                // 登录失败
                const data = await response.json().catch(() => ({}));
                showAlert(data.message || data.error || '用户名或密码错误', 'error');
            } catch (error) {
                console.error('登录错误:', error);
                showAlert('网络错误，请稍后重试', 'error');
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>登录系统';
            }
        });
    </script>
</body>
</html>
