<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录 - 团队任务管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #4a6fa5, #2c3e50);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;
        }
        .card { border: none; border-radius: 12px; box-shadow: 0 12px 24px rgba(0,0,0,0.1); background: #fff; padding: 2.5rem; width: 100%; max-width: 400px; }
        h2 { margin-bottom: 1.5rem; color: #4a6fa5; font-weight: 700; }
        .form-control { background: #f8f9fa; border: 1px solid #ddd; padding: .7rem 1rem; border-radius: 8px; }
        .form-control:focus { background: #fff; border-color: #4a6fa5; box-shadow: 0 0 0 3px rgba(74,111,165,0.25); }
        .btn-primary { background: #4a6fa5; border: none; border-radius: 8px; padding: .7rem; }
        .btn-primary:hover { background: #3a5a80; }
        .btn-primary:disabled { opacity: .6; cursor: not-allowed; }
        .alert-box { display: none; padding: .7rem 1rem; border-radius: 8px; font-size: .9rem; margin-bottom: 1rem; }
        .alert-box.error { display: block; background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert-box.success { display: block; background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>
<div class="card">
    <h2 class="text-center"><i class="fas fa-sign-in-alt me-2"></i>用户登录</h2>
    <div id="alert-msg" class="alert-box"></div>
    <form id="login-form">
        <div class="mb-3">
            <label class="form-label fw-semibold">用户名 / 邮箱</label>
            <input type="text" class="form-control" id="identity" placeholder="请输入用户名或邮箱" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">密码</label>
            <div class="input-group">
                <input type="password" class="form-control" id="password" placeholder="请输入密码" required>
                <button class="btn btn-outline-secondary" type="button" id="toggle-pwd" tabindex="-1" style="border-radius:0 8px 8px 0;"><i class="far fa-eye"></i></button>
            </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2" id="login-btn">
            <i class="fas fa-sign-in-alt me-2"></i>登录系统
        </button>
    </form>
    <div class="mt-4 text-center">
        <a href="/register" class="text-decoration-none text-muted"><i class="fas fa-user-plus me-1"></i>还没有账号？立即注册</a>
    </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
<script>
// 已登录则直接跳转首页
if (localStorage.getItem('jwt_token')) { window.location.href = '/'; }

const form = document.getElementById('login-form');
const identityInput = document.getElementById('identity');
const passwordInput = document.getElementById('password');
const loginBtn = document.getElementById('login-btn');
const alertMsg = document.getElementById('alert-msg');

function showAlert(text, type) { alertMsg.textContent = text; alertMsg.className = 'alert-box ' + type; }

form.addEventListener('submit', async function(e) {
    e.preventDefault();
    showAlert('', '');
    const identity = identityInput.value.trim();
    const password = passwordInput.value;
    if (!identity || !password) return showAlert('请输入账号和密码', 'error');
    loginBtn.disabled = true;
    loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>登录中…';
    try {
        const r = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ identity, password })
        });
        const data = await r.json();
        if (data.success) {
            localStorage.setItem('jwt_token', data.token);
            localStorage.setItem('jwt_user', JSON.stringify(data.user));
            window.location.href = '/';
        } else {
            showAlert(data.message || '账号或密码错误', 'error');
        }
    } catch(e) {
        showAlert('网络错误，请稍后重试', 'error');
    } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>登录系统';
    }
});
document.getElementById('toggle-pwd')?.addEventListener('click', function() {
    const inp = document.getElementById('password');
    const isPwd = inp.type === 'password';
    inp.type = isPwd ? 'text' : 'password';
    this.innerHTML = isPwd ? '<i class="far fa-eye-slash"></i>' : '<i class="far fa-eye"></i>';
});
</script>
</body>
</html>
