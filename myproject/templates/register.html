<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 - 团队任务管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;
        }
        .card { border: none; border-radius: 12px; box-shadow: 0 12px 24px rgba(0,0,0,0.1); background: #fff; padding: 2.5rem; width: 100%; max-width: 450px; }
        h2 { margin-bottom: 1.5rem; color: #667eea; font-weight: 700; }
        .form-control { background: #f8f9fa; border: 1px solid #ddd; padding: .7rem 1rem; border-radius: 8px; }
        .form-control:focus { background: #fff; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.25); }
        .form-control.valid { border-color: #28a745; }
        .form-control.invalid { border-color: #dc3545; }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); border: none; border-radius: 8px; padding: .7rem; }
        .btn-primary:hover { opacity: .9; }
        .btn-primary:disabled { opacity: .6; cursor: not-allowed; }
        .alert-box { display: none; padding: .7rem 1rem; border-radius: 8px; font-size: .9rem; margin-bottom: 1rem; }
        .alert-box.error { display: block; background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert-box.success { display: block; background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .form-text { font-size: .8rem; color: #888; margin-top: .25rem; }
        .form-text .error { color: #dc3545; }
        .form-text .success { color: #28a745; }
    </style>
</head>
<body>
<div class="card">
    <h2 class="text-center"><i class="fas fa-user-plus me-2"></i>创建账号</h2>
    <div id="alert-msg" class="alert-box"></div>
    <form id="register-form">
        <div class="mb-3">
            <label class="form-label fw-semibold">用户名 <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="username" placeholder="3~20 个字符" minlength="3" maxlength="20" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">邮箱 <span class="text-danger">*</span></label>
            <input type="email" class="form-control" id="email" placeholder="your@email.com" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">密码 <span class="text-danger">*</span></label>
            <div class="input-group">
                <input type="password" class="form-control" id="password" placeholder="至少 6 位" minlength="6" required>
                <button class="btn btn-outline-secondary" type="button" id="toggle-pwd1" tabindex="-1" style="border-radius:0 8px 8px 0;"><i class="far fa-eye"></i></button>
            </div>
            <div class="mt-2" style="height:4px;background:#eee;border-radius:2px;overflow:hidden;">
                <div id="strength-bar" style="height:100%;width:0%;border-radius:2px;transition:width .3s,background-color .3s;"></div>
            </div>
            <div class="form-text" id="strength-hint"></div>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">确认密码 <span class="text-danger">*</span></label>
            <div class="input-group">
                <input type="password" class="form-control" id="confirm-password" placeholder="再次输入密码" required>
                <button class="btn btn-outline-secondary" type="button" id="toggle-pwd2" tabindex="-1" style="border-radius:0 8px 8px 0;"><i class="far fa-eye"></i></button>
            </div>
            <div class="form-text" id="confirm-hint"></div>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2" id="register-btn">
            <i class="fas fa-user-plus me-2"></i>注册
        </button>
    </form>
    <div class="mt-4 text-center">
        <a href="/login" class="text-decoration-none text-muted"><i class="fas fa-sign-in-alt me-1"></i>已有账号？立即登录</a>
    </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
<script>
// 已登录则直接跳转首页
if (false) { window.location.href = '/'; }

const form = document.getElementById('register-form');
const usernameInput = document.getElementById('username');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const confirmInput = document.getElementById('confirm-password');
const confirmHint = document.getElementById('confirm-hint');
const registerBtn = document.getElementById('register-btn');
const alertMsg = document.getElementById('alert-msg');

function showAlert(text, type) { alertMsg.textContent = text; alertMsg.className = 'alert-box ' + type; }

// 实时密码确认检查
confirmInput.addEventListener('input', function() {
    const pw = passwordInput.value.trim();
    const cpw = this.value.trim();
    if (!cpw) { confirmHint.textContent = ''; this.className = ''; return; }
    if (pw === cpw) {
        confirmHint.innerHTML = '<span class="success">密码一致 ✓</span>';
        this.className = 'valid';
    } else {
        confirmHint.innerHTML = '<span class="error">密码不一致</span>';
        this.className = 'invalid';
    }
});

// 密码修改时同步确认检查
passwordInput.addEventListener('input', function() {
    const pw = this.value;
    // 密码强度
    const bar = document.getElementById('strength-bar');
    const hint = document.getElementById('strength-hint');
    let score = 0;
    if (pw.length >= 6) score++;
    if (pw.length >= 10) score++;
    if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) score++;
    if (/\d/.test(pw)) score++;
    if (/[^A-Za-z0-9]/.test(pw)) score++;
    if (!pw) { bar.style.width = '0%'; hint.textContent = ''; return; }
    if (score <= 2) { bar.style.width = '33%'; bar.style.background = '#dc3545'; hint.innerHTML = '<span class="error">弱</span>'; }
    else if (score <= 3) { bar.style.width = '66%'; bar.style.background = '#ffc107'; hint.innerHTML = '<span class="error">中</span>'; }
    else { bar.style.width = '100%'; bar.style.background = '#28a745'; hint.innerHTML = '<span class="success">强 ✓</span>'; }
    // 同步确认检查
    if (confirmInput.value.trim()) {
        confirmInput.dispatchEvent(new Event('input'));
    }
});

form.addEventListener('submit', async function(e) {
    e.preventDefault();
    showAlert('', '');
    const username = usernameInput.value.trim();
    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();
    const confirmPassword = confirmInput.value.trim();
    if (!username || !email || !password || !confirmPassword) return showAlert('请填写所有必填项', 'error');
    if (username.length < 3 || username.length > 20) return showAlert('用户名长度必须在 3~20 个字符之间', 'error');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showAlert('邮箱格式不正确', 'error');
    if (password.length < 6) return showAlert('密码长度至少 6 位', 'error');
    if (password !== confirmPassword) return showAlert('两次输入的密码不一致', 'error');
    registerBtn.disabled = true;
    registerBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>注册中…';
    try {
        const r = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, email, password, confirm_password: confirmPassword })
        });
        const data = await r.json();
        if (data.success) {
            showAlert('注册成功，正在进入系统…', 'success');
            setTimeout(() => { window.location.href = '/'; }, 800);
        } else {
            showAlert(data.message || '注册失败', 'error');
        }
    } catch(e) {
        showAlert('网络错误，请稍后重试', 'error');
    } finally {
        registerBtn.disabled = false;
        registerBtn.innerHTML = '<i class="fas fa-user-plus me-2"></i>注册';
    }
});
['toggle-pwd1','toggle-pwd2'].forEach(id => {
    document.getElementById(id)?.addEventListener('click', function() {
        const targetId = id === 'toggle-pwd1' ? 'password' : 'confirm-password';
        const inp = document.getElementById(targetId);
        const isPwd = inp.type === 'password';
        inp.type = isPwd ? 'text' : 'password';
        this.innerHTML = isPwd ? '<i class="far fa-eye-slash"></i>' : '<i class="far fa-eye"></i>';
    });
});
</script>

    <footer style="background:#f0f2f5;padding:.8rem 0;margin-top:2rem;border-top:1px solid #e0e0e0;">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                <small class="text-muted">&copy; 2026 团队任务管理系统</small>
                <div class="d-flex gap-3">
                    <a href="/" class="text-muted text-decoration-none small"><i class="fas fa-home me-1"></i>首页</a>
                    <a href="/about" class="text-muted text-decoration-none small"><i class="fas fa-info-circle me-1"></i>关于</a>
                    <a href="/gantt" class="text-muted text-decoration-none small"><i class="fas fa-chart-bar me-1"></i>甘特图</a>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
